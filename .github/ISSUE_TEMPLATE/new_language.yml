name: New language
description: Offer a translation, or announce one you are working on, so nobody translates the same thing twice.
title: "Translation: <language>"
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A translation is welcome in two parts: the entity and
        config texts on their own are already useful, because the spoken side
        of the integration falls back to English for a language it does not
        have. Tick what you intend to do; nothing here is required beyond the
        first part.

        The page texts under `docs/` are deliberately not on this list. They
        are thirteen pages per language and are kept in English and Dutch only.

  - type: input
    id: language
    attributes:
      label: Language
      description: The name of the language, and the code Home Assistant uses for it (the one in Settings → System → General, for example `de` or `pt-BR`).
      placeholder: "German, de"
    validations:
      required: true

  - type: dropdown
    id: speaker
    attributes:
      label: Are you a native or daily speaker of this language?
      description: The texts are short, but the spoken answers and the Assist sentences only work when they sound natural. A machine translation left as is does not.
      options:
        - "Yes"
        - "No, but I use the integration in this language"
    validations:
      required: true

  - type: checkboxes
    id: layers
    attributes:
      label: What you intend to translate
      description: The first part is a copy of a JSON file. The second needs sentences that sound right out loud, and comes as a whole, because an answer nobody can ask for is no use.
      options:
        - label: "**Entity, config and service texts**: `custom_components/adsb_station/translations/<code>.json`, a copy of `en.json` with only the values translated. Keys and placeholders such as `{station}` stay as they are."
        - label: "**Spoken answers and Assist sentences**: a `<code>` entry in `PHRASES`, `SECTORS`, `_THOUSANDS` and `_DECIMAL` in `custom_components/adsb_station/speech.py`, with the keys of the `en` entry (a phrase left out is said in English), and `custom_components/adsb_station/sentences/<code>/adsb_station.yaml` with one entry per intent in the `en` file, written the way people actually ask. Keyed by the language alone, without a region: `pt`, not `pt-BR`."

  - type: input
    id: numbers
    attributes:
      label: How the language writes numbers
      description: Only needed for the second part. Which character groups the thousands, and which one is the decimal separator? English writes 3,700 and 2.5; Dutch writes 3.700 and 2,5. Getting this wrong turns a height into a different number.
      placeholder: "thousands: . (full stop)   decimal: , (comma)"

  - type: textarea
    id: notes
    attributes:
      label: Anything worth knowing
      description: A term that has no good equivalent, a phrase you are unsure about, a sentence the English version has that nobody would say in your language. Questions are fine here; nothing has to be finished before you open this.

  - type: checkboxes
    id: checks
    attributes:
      label: Before opening the pull request
      options:
        - label: I have read the Translations section of [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
        - label: I will keep the keys identical to the English file, so the checks can compare the two.
