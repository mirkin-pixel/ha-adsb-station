name: Reference tables

# The airlines, aircraft types, address blocks and airports the integration
# ships come from public data that changes over time. On the first of each
# month, and by hand, this rebuilds them and opens a pull request when they
# changed, or brings the open one up to date. Nothing changed, nothing opened.
#
# The pull request comes from the project's own GitHub App rather than from
# this workflow's token, as only then do the checks run on it. The app's ID and
# private key are the secrets BOT_APP_ID and BOT_PRIVATE_KEY.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild the reference tables
    runs-on: ubuntu-latest
    steps:
      - name: Get a token of the project's bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.bot.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Rebuild them
        run: python scripts/build_reference.py

      - name: Say what changed
        run: |
          changes="$(python scripts/reference_changes.py)"
          {
            echo "## What and why"
            echo
            echo "The monthly rebuild of the reference tables from their public sources, by \`scripts/build_reference.py\`:"
            echo
            echo "$changes"
            echo
            echo "## Checklist"
            echo
            echo "- [x] Generated by \`scripts/build_reference.py\`; the checks run on this pull request."
          } > pr-body.md

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot.outputs.token }}
          sign-commits: true
          branch: reference-tables
          delete-branch: true
          add-paths: |
            custom_components/adsb_station/airlines.json
            custom_components/adsb_station/aircraft_models.json
            custom_components/adsb_station/code_blocks.json
            custom_components/adsb_station/airports.json
          commit-message: Refresh the reference tables from their sources
          title: Refresh the reference tables from their sources
          body-path: pr-body.md
