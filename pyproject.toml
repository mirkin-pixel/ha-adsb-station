[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Stands in for what Home Assistant expects of a POSIX host. A no-op on Linux.
addopts = "-p pytest_windows"
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/adsb_station"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.14"
# Only the integration. The tests lean on fixtures typed loosely enough that
# checking them would cost more noise than it catches.
files = ["custom_components/adsb_station"]
# Home Assistant ships type information, but a good deal of what it imports
# does not, and none of that is ours to fix.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.adsb_station"]
combine-as-imports = true
